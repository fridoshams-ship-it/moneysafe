name: Deploy testnet
# Manual: Actions → "Deploy testnet" → Run workflow.
# Needs repository secret DEPLOYER_KEY (a NEW wallet used only for testnet, with test ETH on the chosen network).
# RPC secrets (ARB_SEPOLIA_RPC, BASE_SEPOLIA_RPC, AMOY_RPC) are optional: public RPCs are used by default.
on:
  workflow_dispatch:
    inputs:
      network:
        description: "Test network"
        type: choice
        options: [arbitrumSepolia, baseSepolia, polygonAmoy]
        default: arbitrumSepolia
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: contracts/package-lock.json }
      - run: npm ci
      - run: npx hardhat test
      - name: Deploy test tokens, market and factory
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC || 'https://sepolia-rollup.arbitrum.io/rpc' }}
          BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC || 'https://sepolia.base.org' }}
          AMOY_RPC: ${{ secrets.AMOY_RPC || 'https://rpc-amoy.polygon.technology' }}
        run: npx hardhat run scripts/deploy-testnet.js --network ${{ inputs.network }}
      - name: Save addresses to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments
          git commit -m "Testnet deployment: ${{ inputs.network }}" || echo "nothing to commit"
          git push
